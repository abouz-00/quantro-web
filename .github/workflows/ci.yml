name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      DATABASE_URL: "file:./test.db"
    
    strategy:
      matrix:
        node-version: [20.x]  # Only test on latest stable LTS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --ignore-scripts
      env:
        DATABASE_URL: "file:./test.db"
      
    - name: Set up test database
      run: |
        echo "Setting up test environment..."
        export NODE_ENV=test
        export DATABASE_URL="file:./test.db"
        
        echo "Cleaning any cached Prisma config..."
        rm -rf generated/prisma .prisma
        
        echo "Verifying schema file content..."
        cat prisma/schema.prisma | head -15
        
        echo "Verifying Prisma client package..."
        ls -la node_modules/@prisma/client/ || echo "Warning: @prisma/client not found"
        
        echo "Creating node_modules/.prisma/client directory..."
        mkdir -p node_modules/.prisma/client
        
        echo "Generating Prisma client..."
        npx prisma generate --schema=./prisma/schema.prisma || { echo "❌ Prisma generate failed"; exit 1; }
        echo "✅ Prisma client generated successfully"
        
        echo "Setting up test database..."
        npx prisma db push --force-reset --schema=./prisma/schema.prisma || { echo "❌ Database push failed"; exit 1; }
        echo "✅ Test database setup complete"
      timeout-minutes: 8
        
    - name: Run linting
      run: npm run lint
      
    - name: Run type checking
      run: npm run type-check
      
    - name: Run tests with optimizations
      run: npm run test:ci
      timeout-minutes: 20
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        JEST_WORKERS: 2
        DATABASE_URL: "file:./test.db"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env:
      DATABASE_URL: "file:./test.db"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --ignore-scripts
      env:
        DATABASE_URL: "file:./test.db"

    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Run audit-ci for security vulnerabilities
      run: npx audit-ci --config ./audit-ci.json
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    timeout-minutes: 15
    
    env:
      NODE_ENV: production
      DATABASE_URL: "file:./build.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "build-secret-key-for-ci"
      NEXT_TELEMETRY_DISABLED: 1
      # Add dummy values for Apple Sign-In to prevent build failures
      APPLE_PRIVATE_KEY: "dummy-key-for-build"
      APPLE_TEAM_ID: "dummy-team-id"
      APPLE_PRIVATE_KEY_ID: "dummy-key-id"
      APPLE_ID: "dummy-apple-id"
      # Add dummy Google OAuth values
      GOOGLE_CLIENT_ID: "dummy-google-client-id"
      GOOGLE_CLIENT_SECRET: "dummy-google-secret"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --ignore-scripts
      env:
        DATABASE_URL: "file:./build.db"
      
    - name: Generate Prisma client
      run: |
        echo "Cleaning any cached Prisma config..."
        rm -rf generated/prisma .prisma ~/.cache/prisma
        
        echo "Generating Prisma client for CI build (using SQLite schema)..."
        npx prisma generate --schema=./prisma/schema.prisma || { echo "❌ Prisma generate failed"; exit 1; }
        echo "✅ Prisma client generated successfully"
        
    - name: Set up build database
      run: |
        echo "Setting up build database..."
        npx prisma db push --force-reset --schema=./prisma/schema.prisma || { echo "❌ Database setup failed"; exit 1; }
        echo "✅ Build database setup complete"
        
    - name: Build application
      run: |
        echo "Starting build process..."
        echo "Node.js version: $(node --version)"
        echo "npm version: $(npm --version)"
        echo "Environment variables check:"
        echo "- NODE_ENV: $NODE_ENV"
        echo "- DATABASE_URL: $DATABASE_URL"
        echo "- NEXTAUTH_URL: $NEXTAUTH_URL"
        echo "- NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:0:5}..."
        echo "Running build with SQLite schema..."
        # Use SQLite schema for CI builds
        npx prisma generate --schema=./prisma/schema.prisma && npx next build || { echo "❌ Build failed"; exit 1; }
        echo "✅ Build completed successfully"
        echo "Build output size:"
        du -sh .next/ || echo "No .next directory found"
      
    - name: Verify build output
      run: |
        echo "Checking build output structure..."
        if [ -d ".next" ]; then
          echo "✅ Build directory exists"
          echo "Contents of .next/:"
          ls -la .next/ || echo "Could not list .next contents"
          echo "Total size:"
          du -sh .next/ || echo "Could not calculate size"
          echo "Key files check:"
          [ -f ".next/package.json" ] && echo "✅ package.json found" || echo "⚠️  package.json missing (may be normal for standalone builds)"
          [ -d ".next/server" ] && echo "✅ server directory found" || echo "⚠️  server directory missing"
          [ -d ".next/static" ] && echo "✅ static directory found" || echo "⚠️  static directory missing"
          [ -f ".next/standalone/server.js" ] && echo "✅ standalone server.js found" || echo "⚠️  standalone server.js missing"
        else
          echo "❌ Build directory not found"
          echo "Current directory contents:"
          ls -la
          echo "This will cause artifact upload to fail, but continuing..."
        fi
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-artifacts
        path: |
          .next/
          !.next/cache/
          !.next/.tsbuildinfo
        retention-days: 7
        if-no-files-found: warn
        compression-level: 6
        
    - name: Upload standalone build (fallback)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: standalone-build
        path: |
          .next/standalone/
          .next/static/
          .next/*.json
          .next/BUILD_ID
        retention-days: 7
        if-no-files-found: ignore
      continue-on-error: true
      
    - name: Create build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Artifact Type | Status | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|---------------|--------|------|" >> $GITHUB_STEP_SUMMARY
        if [ -d ".next" ]; then
          NEXT_SIZE=$(du -sh .next/ | cut -f1)
          echo "| .next directory | ✅ Created | $NEXT_SIZE |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| .next directory | ❌ Missing | - |" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -d ".next/standalone" ]; then
          STANDALONE_SIZE=$(du -sh .next/standalone/ | cut -f1)
          echo "| Standalone build | ✅ Created | $STANDALONE_SIZE |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Standalone build | ❌ Missing | - |" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f ".next/server.js" ]; then
          echo "| Server file | ✅ Found | - |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Server file | ❌ Missing | - |" >> $GITHUB_STEP_SUMMARY
        fi

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      env:
        DATABASE_URL: "file:./staging.db"
      
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-artifacts
        path: ./
      continue-on-error: true
        
    - name: Download standalone build (fallback)
      if: failure()
      uses: actions/download-artifact@v8
      with:
        name: standalone-build
        path: ./
      continue-on-error: true
        
    - name: Verify artifacts
      run: |
        if [ -d ".next" ]; then
          echo "✅ Build artifacts downloaded successfully"
          echo "Build directory contents:"
          ls -la .next/
          echo "Checking key standalone files:"
          [ -f ".next/package.json" ] && echo "✅ Standalone package.json found" || echo "⚠️  Standalone package.json missing"
          [ -d ".next/server" ] && echo "✅ Server directory found" || echo "❌ Server directory missing - this may cause deployment issues"
        else
          echo "❌ Build artifacts not found, attempting fresh build"
          export NODE_ENV=production
          export DATABASE_URL="file:./deploy.db"
          export NEXTAUTH_URL="https://quantro-staging.vercel.app"
          npx prisma generate
          npx prisma db push --force-reset
          npm run build
        fi
      env:
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        
    - name: Deploy to Staging (Vercel)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prebuilt --env staging'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        scope: ${{ secrets.VERCEL_ORG_ID }}
      continue-on-error: true

  # Production deployment handled automatically by Vercel GitHub integration
  # When tests pass on main branch, Vercel deploys automatically to quantro.fit
  deployment-check:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deployment info
      run: |
        echo "✅ Tests passed - Vercel will auto-deploy to production"
        echo "🌐 Deployment will be live at: https://quantro.fit"
        echo "📊 Monitor deployment at: https://vercel.com/quantro-dev/quantro-web"
