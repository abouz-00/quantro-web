name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      DATABASE_URL: "file:./test.db"
    
    strategy:
      matrix:
        node-version: [20.x]  # Only test on latest stable LTS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Cache Prisma
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/prisma
          ./node_modules/.prisma
        key: ${{ runner.os }}-prisma-${{ hashFiles('**/schema.prisma') }}
        restore-keys: |
          ${{ runner.os }}-prisma-
      
    - name: Set up test database
      run: |
        echo "Setting up test environment..."
        export NODE_ENV=test
        export DATABASE_URL="file:./test.db"
        
        echo "Generating Prisma client..."
        npx prisma generate || { echo "❌ Prisma generate failed"; exit 1; }
        echo "✅ Prisma client generated successfully"
        
        echo "Setting up test database..."
        npx prisma db push --force-reset || { echo "❌ Database push failed"; exit 1; }
        echo "✅ Test database setup complete"
      timeout-minutes: 8
        
    - name: Run linting
      run: npm run lint
      
    - name: Run type checking
      run: npm run type-check
      
    - name: Run tests with optimizations
      run: npm run test:ci
      timeout-minutes: 20
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        JEST_WORKERS: 2
        DATABASE_URL: "file:./test.db"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Run audit-ci for security vulnerabilities
      run: npx audit-ci --config ./audit-ci.json
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Cache Prisma
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/prisma
          ./node_modules/.prisma
        key: ${{ runner.os }}-prisma-${{ hashFiles('**/schema.prisma') }}
        restore-keys: |
          ${{ runner.os }}-prisma-
      
    - name: Generate Prisma client
      run: npx prisma generate
        
    - name: Build application
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: .next/
        retention-days: 7

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: .next/
        
    - name: Deploy to Staging (Vercel)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prebuilt --env staging'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        scope: ${{ secrets.VERCEL_ORG_ID }}
      continue-on-error: true

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: .next/
        
    - name: Deploy to Production (Vercel)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prebuilt --prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        scope: ${{ secrets.VERCEL_ORG_ID }}
      continue-on-error: true
