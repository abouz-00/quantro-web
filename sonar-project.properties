# SonarCloud Configuration
sonar.projectKey=quantrodev_Quantro
sonar.organization=quantrodev

# Project Information
sonar.projectName=Quantro
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src/
sonar.tests=src/
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/*.config.js,**/*.config.ts,**/public/**

# Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language Configuration
sonar.javascript.environments=node,jest
sonar.typescript.tsconfigPath=tsconfig.json

# Analysis Configuration
sonar.sourceEncoding=UTF-8
