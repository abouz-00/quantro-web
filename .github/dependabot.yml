version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "quantrodev"
    assignees:
      - "quantrodev"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "patch"
          - "minor"
      grouped-prod-updates:
        dependency-type: "production"
        exclude-patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "patch"
          - "minor"
      grouped-dev-updates:
        dependency-type: "development"
        exclude-patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Keep Node.js types stable unless major updates needed
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Ignore Tailwind CSS updates
      - dependency-name: "tailwindcss"
      # Ignore ESLint 10.x - ecosystem (eslint-config-next, eslint-plugin-react, etc.) doesn't support it yet
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
