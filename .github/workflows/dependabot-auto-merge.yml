name: Auto-approve and merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2.2.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Enable auto-merge for patch and minor updates
        if: |
          contains(steps.metadata.outputs.update-type, 'version-update:semver-patch') || 
          contains(steps.metadata.outputs.update-type, 'version-update:semver-minor') ||
          (steps.metadata.outputs.dependency-group != '' && 
           (contains(github.event.pull_request.title, 'grouped-dev-updates') ||
            contains(github.event.pull_request.title, 'grouped-prod-updates')))
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Label major updates for manual review
        if: contains(steps.metadata.outputs.update-type, 'version-update:semver-major')
        run: |
          gh pr edit "$PR_URL" --add-label "major-update" --add-label "needs-review"
          gh pr comment "$PR_URL" --body "🚨 This is a major version update that requires manual review before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}