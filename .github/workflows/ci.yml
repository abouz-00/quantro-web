name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      DATABASE_URL: "file:./test.db"
    
    strategy:
      matrix:
        node-version: [20.x]  # Only test on latest stable LTS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Cache Prisma
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/prisma
          ./node_modules/.prisma
        key: ${{ runner.os }}-prisma-${{ hashFiles('**/schema.prisma') }}
        restore-keys: |
          ${{ runner.os }}-prisma-
      
    - name: Set up test database
      run: |
        echo "Setting up test environment..."
        export NODE_ENV=test
        export DATABASE_URL="file:./test.db"
        
        echo "Generating Prisma client..."
        npx prisma generate || { echo "❌ Prisma generate failed"; exit 1; }
        echo "✅ Prisma client generated successfully"
        
        echo "Setting up test database..."
        npx prisma db push --force-reset || { echo "❌ Database push failed"; exit 1; }
        echo "✅ Test database setup complete"
      timeout-minutes: 8
        
    - name: Run linting
      run: npm run lint
      
    - name: Run type checking
      run: npm run type-check
      
    - name: Run tests with optimizations
      run: npm run test:ci
      timeout-minutes: 20
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        JEST_WORKERS: 2
        DATABASE_URL: "file:./test.db"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Run audit-ci for security vulnerabilities
      run: npx audit-ci --config ./audit-ci.json
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    timeout-minutes: 15
    
    env:
      NODE_ENV: production
      DATABASE_URL: "file:./build.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "build-secret-key-for-ci"
      NEXT_TELEMETRY_DISABLED: 1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      
    - name: Cache Prisma
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/prisma
          ./node_modules/.prisma
        key: ${{ runner.os }}-prisma-${{ hashFiles('**/schema.prisma') }}
        restore-keys: |
          ${{ runner.os }}-prisma-
      
    - name: Generate Prisma client
      run: |
        echo "Generating Prisma client..."
        npx prisma generate || { echo "❌ Prisma generate failed"; exit 1; }
        echo "✅ Prisma client generated successfully"
        
    - name: Set up build database
      run: |
        echo "Setting up build database..."
        npx prisma db push --force-reset || { echo "❌ Database setup failed"; exit 1; }
        echo "✅ Build database setup complete"
        
    - name: Build application
      run: |
        echo "Starting build process..."
        npm run build || { echo "❌ Build failed"; exit 1; }
        echo "✅ Build completed successfully"
      
    - name: Verify build output
      run: |
        echo "Checking build output structure..."
        if [ -d ".next" ]; then
          echo "✅ Build directory exists"
          echo "Contents of .next/:"
          ls -la .next/
          echo "Total size:"
          du -sh .next/
          echo "Key files check:"
          [ -f ".next/package.json" ] && echo "✅ package.json found" || echo "❌ package.json missing"
          [ -d ".next/server" ] && echo "✅ server directory found" || echo "❌ server directory missing"
          [ -d ".next/static" ] && echo "✅ static directory found" || echo "❌ static directory missing"
        else
          echo "❌ Build directory not found"
          echo "Current directory contents:"
          ls -la
          exit 1
        fi
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          .next/
          !.next/cache/
          !.next/.tsbuildinfo
        retention-days: 7
        if-no-files-found: error
        compression-level: 6

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./
      continue-on-error: false
        
    - name: Verify artifacts
      run: |
        if [ -d ".next" ]; then
          echo "✅ Build artifacts downloaded successfully"
          echo "Build directory contents:"
          ls -la .next/
          echo "Checking key standalone files:"
          [ -f ".next/package.json" ] && echo "✅ Standalone package.json found" || echo "⚠️  Standalone package.json missing"
          [ -d ".next/server" ] && echo "✅ Server directory found" || echo "❌ Server directory missing - this may cause deployment issues"
        else
          echo "❌ Build artifacts not found, attempting fresh build"
          export NODE_ENV=production
          export DATABASE_URL="file:./deploy.db"
          export NEXTAUTH_URL="https://quantro-staging.vercel.app"
          npx prisma generate
          npx prisma db push --force-reset
          npm run build
        fi
      env:
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        
    - name: Deploy to Staging (Vercel)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prebuilt --env staging'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        scope: ${{ secrets.VERCEL_ORG_ID }}
      continue-on-error: true

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./
      continue-on-error: false
        
    - name: Verify artifacts
      run: |
        if [ -d ".next" ]; then
          echo "✅ Build artifacts downloaded successfully"
          echo "Build directory contents:"
          ls -la .next/
          echo "Checking key standalone files:"
          [ -f ".next/package.json" ] && echo "✅ Standalone package.json found" || echo "⚠️  Standalone package.json missing"
          [ -d ".next/server" ] && echo "✅ Server directory found" || echo "❌ Server directory missing - this may cause deployment issues"
        else
          echo "❌ Build artifacts not found, attempting fresh build"
          export NODE_ENV=production
          export DATABASE_URL="file:./deploy.db"
          export NEXTAUTH_URL="https://quantro.vercel.app"
          npx prisma generate
          npx prisma db push --force-reset
          npm run build
        fi
      env:
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        
    - name: Deploy to Production (Vercel)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prebuilt --prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        scope: ${{ secrets.VERCEL_ORG_ID }}
      continue-on-error: true
