name: Vercel CLI Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview (Vercel CLI)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required Vercel secrets
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.vercel_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Install Vercel CLI
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (preview)
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set up build database
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: |
          npx prisma generate --schema=./prisma/schema.prisma
          npx prisma db push --force-reset --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: "file:./build.db"

      - name: Build artifacts with Vercel CLI
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: "file:./build.db"
          NEXTAUTH_SECRET: "build-secret-for-ci"
          NEXTAUTH_URL: "https://quantro.fit"
          APPLE_PRIVATE_KEY: "dummy-key-for-build"
          APPLE_TEAM_ID: "dummy-team-id"
          APPLE_PRIVATE_KEY_ID: "dummy-key-id"
          APPLE_ID: "dummy-apple-id"
          GOOGLE_CLIENT_ID: "dummy-google-client-id"
          GOOGLE_CLIENT_SECRET: "dummy-google-secret"

      - name: Deploy preview
        id: deploy
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        if: steps.vercel_secrets.outputs.ready == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            const body = `### Preview Deployment\n\n${url}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Explain skipped deploy (missing secrets)
        if: steps.vercel_secrets.outputs.ready != 'true'
        run: |
          echo "Preview deploy skipped because one or more required Vercel secrets are missing: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID."

  deploy-preview-fork-note:
    name: Preview Skipped (Fork PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped deploy
        run: |
          echo "Preview deploy skipped for fork PRs because repository secrets are unavailable."

  deploy-production:
    name: Deploy Production (Vercel CLI)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required Vercel secrets
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.vercel_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Install Vercel CLI
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set up build database
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: |
          npx prisma generate --schema=./prisma/schema.prisma
          npx prisma db push --force-reset --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: "file:./build.db"

      - name: Build artifacts with Vercel CLI
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: "file:./build.db"
          NEXTAUTH_SECRET: "build-secret-for-ci"
          NEXTAUTH_URL: "https://quantro.fit"
          APPLE_PRIVATE_KEY: "dummy-key-for-build"
          APPLE_TEAM_ID: "dummy-team-id"
          APPLE_PRIVATE_KEY_ID: "dummy-key-id"
          APPLE_ID: "dummy-apple-id"
          GOOGLE_CLIENT_ID: "dummy-google-client-id"
          GOOGLE_CLIENT_SECRET: "dummy-google-secret"

      - name: Deploy production
        if: steps.vercel_secrets.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Explain skipped deploy (missing secrets)
        if: steps.vercel_secrets.outputs.ready != 'true'
        run: |
          echo "Production deploy skipped because one or more required Vercel secrets are missing: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID."
