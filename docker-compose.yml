version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=quantro
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=quantro_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
