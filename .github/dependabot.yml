version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "quantrodev"
    assignees:
      - "quantrodev"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    auto-merge: false
    groups:
      grouped-prod-updates:
        dependency-type: "production"
        patterns:
          - "*"
      grouped-dev-updates:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Keep Node.js types stable unless major updates needed
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Ignore Tailwind CSS updates
      - dependency-name: "tailwindcss"
      
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
