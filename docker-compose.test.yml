version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass
      - POSTGRES_DB=quantro_test
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d quantro_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  app-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://test_user:test_pass@postgres-test:5432/quantro_test
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=test-secret-key
      - NODE_ENV=test
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "cp prisma/schema.docker.prisma prisma/schema.prisma && echo '⏳ Waiting for PostgreSQL...' && sleep 5 && npx prisma db push --force-reset && npx jest --ci --coverage --watchAll=false --forceExit --detectOpenHandles --maxWorkers=2"

volumes:
  postgres_test_data:
