name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      DATABASE_URL: "file:./test.db"
  e2e:
    runs-on: ubuntu-latest
    needs: [test, security]
    timeout-minutes: 15
    
    env:
      DATABASE_URL: "file:./e2e.db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "e2e-test-secret"
      APPLE_PRIVATE_KEY: "dummy-key"
      APPLE_TEAM_ID: "dummy-team-id"
      APPLE_PRIVATE_KEY_ID: "dummy-key-id"
      APPLE_ID: "dummy-apple-id"
      GOOGLE_CLIENT_ID: "dummy-google-client-id"
      GOOGLE_CLIENT_SECRET: "dummy-google-secret"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --ignore-scripts
      env:
        DATABASE_URL: "file:./e2e.db"

    - name: Set up database
      run: |
        npx prisma generate --schema=./prisma/schema.prisma
        npx prisma db push --force-reset --schema=./prisma/schema.prisma

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: npx playwright test
      
    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      env:
        DATABASE_URL: "file:./staging.db"
      
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-artifacts
        path: ./
      continue-on-error: true

    - name: Download standalone build (fallback)
      if: failure()
      uses: actions/download-artifact@v8
      with:
        name: standalone-build
        path: ./
      continue-on-error: true

    - name: Verify artifacts
      run: |
        if [ -d ".next" ]; then
          echo "✅ Build artifacts downloaded successfully"
          echo "Build directory contents:"
          ls -la .next/
          echo "Checking key standalone files:"
          [ -f ".next/package.json" ] && echo "✅ Standalone package.json found" || echo "⚠️  Standalone package.json missing"
          [ -d ".next/server" ] && echo "✅ Server directory found" || echo "❌ Server directory missing - this may cause deployment issues"
        else
          echo "❌ Build artifacts not found, attempting fresh build"
          export NODE_ENV=production
          export DATABASE_URL="file:./deploy.db"
          export NEXTAUTH_URL="https://quantro-staging.vercel.app"
          npx prisma generate
          npx prisma db push --force-reset
          npm run build
        fi
      env:
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        
    - name: Deploy to Staging (Vercel)
      uses: amondnet/vercel-action@v42
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prebuilt --env staging'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        scope: ${{ secrets.VERCEL_ORG_ID }}
      continue-on-error: true

  # Production deployment handled automatically by Vercel GitHub integration
  # When tests pass on main branch, Vercel deploys automatically to quantro.fit
  deployment-check:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deployment info
      run: |
        echo "✅ Tests passed - Vercel will auto-deploy to production"
        echo "🌐 Deployment will be live at: https://quantro.fit"
        echo "📊 Monitor deployment at: https://vercel.com/quantro-dev/quantro-web"
