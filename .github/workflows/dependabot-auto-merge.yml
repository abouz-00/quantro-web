name: Auto-approve and merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  # This job waits for CI checks to complete before auto-merging
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Wait for CI checks to complete
        uses: lewagon/wait-on-check-action@v1.9.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          # Wait for all checks to complete (tests, linting, build, etc.)
          running-workflow-name: 'dependabot'
      
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Enable auto-merge for patch and minor updates (only after CI passes)
        if: |
          contains(steps.metadata.outputs.update-type, 'version-update:semver-patch') || 
          contains(steps.metadata.outputs.update-type, 'version-update:semver-minor')
        run: |
          gh pr merge --auto --squash "$PR_URL"
          gh pr comment "$PR_URL" --body "✅ All CI checks passed. Auto-merging this dependency update."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create labels if they don't exist
        if: contains(steps.metadata.outputs.update-type, 'version-update:semver-major')
        run: |
          # Create labels if they don't exist (idempotent operation)
          gh label create "major-update" --description "Major version update requiring manual review" --color "d73a4a" --force || true
          gh label create "needs-review" --description "Requires manual review before merging" --color "fbca04" --force || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Label major updates for manual review
        if: contains(steps.metadata.outputs.update-type, 'version-update:semver-major')
        run: |
          # Add labels to PR
          gh pr edit "$PR_URL" --add-label "major-update" --add-label "needs-review" || echo "⚠️ Could not add labels"
          gh pr comment "$PR_URL" --body "🚨 This is a major version update that requires manual review before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}